name: tests

# Регрессионные тесты модели. Идут около минуты, сеть не нужна.
# Файл кладётся в .github/workflows/tests.yml

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Проверка синтаксиса всех модулей
        run: |
          python -m compileall -q desktop android
          python -m compileall -q main.py

      # Ядро без единого стороннего пакета. Свойство не формальное:
      # настольная версия рассчитана на голый Python, и если модель начнёт
      # требовать pytest, узнать об этом надо здесь, а не от человека,
      # который скачал скрипт и запустил его у себя.
      - name: Ядро на голом Python
        run: python -m unittest tests.test_model tests.test_markup -v

      # Раньше здесь стоял `unittest discover` по всему каталогу — и с
      # некоторых пор он не столько проверял, сколько падал: pytest в этот
      # момент ещё не установлен, а из двадцати семи файлов тестов без него
      # импортируются два. Каталог целиком прогоняется тем, чем он и
      # написан, — pytest'ом. Kivy здесь нет намеренно: всё, что требует
      # окна, пропускается и проверяется следующим шагом под Xvfb.
      - name: Тесты без Kivy
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests -q

      # Полный прогон под Xvfb: с установленным Kivy идёт всё, включая
      # дымовой тест, где окна создаются и рисуются по-настоящему. Он
      # появился после того, как на телефон уехала кнопка, падавшая в
      # конструкторе экрана похода: арифметика была верной, а отрисовка нет.
      #
      # Здесь прогон полный намеренно. Релизная сборка идёт в образе
      # buildozer, где Kivy нет, и всё, что его требует, там пропускается —
      # значит проверено это должно быть тут, иначе не проверено нигде.
      - name: Полный прогон под Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libmtdev1 libsdl2-2.0-0 \
            libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 libsdl2-ttf-2.0-0
          python -m pip install --quiet pytest 'kivy==2.3.1'
          xvfb-run -a python -m pytest tests -q

      # Тесты не должны зависеть от того, откуда их запустили. Проверка не
      # теоретическая: релизная сборка однажды встала на сборе тестов —
      # путь к исходникам собирался как «../android» от рабочего каталога и
      # указал за пределы проекта. Сломалось ровно то, что должно ловить
      # поломки, и заметно это стало только в релизе.
      - name: Прогон из чужого каталога
        run: cd /tmp && xvfb-run -a python -m pytest "$GITHUB_WORKSPACE/tests" -q

      - name: Прогон консольной версии на демо-погоде
        working-directory: desktop
        run: |
          python mushroom_forecast.py --demo --days 7
          python mushroom_forecast.py --demo --json > /dev/null
          python mushroom_forecast.py --version
