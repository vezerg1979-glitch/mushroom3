name: tests

# Регрессионные тесты модели. Идут около минуты, сеть не нужна.
# Файл кладётся в .github/workflows/tests.yml

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Проверка синтаксиса всех модулей
        run: |
          python -m compileall -q desktop android
          python -m compileall -q main.py

      - name: Регрессионные тесты
        run: python -m unittest discover -s tests -v

      # Дымовой прогон интерфейса: окна Kivy создаются и рисуются по-настоящему.
      # Появился после того, как на телефон уехала кнопка, падавшая в
      # конструкторе экрана похода, — арифметика была верной, а отрисовка нет.
      # Без экрана Kivy не поднимается, поэтому Xvfb.
      - name: Интерфейс под Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libmtdev1 libsdl2-2.0-0 \
            libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 libsdl2-ttf-2.0-0
          python -m pip install --quiet pytest 'kivy==2.3.1'
          xvfb-run -a python -m pytest tests/smoke_ui_test.py -q

      - name: Прогон консольной версии на демо-погоде
        working-directory: desktop
        run: |
          python mushroom_forecast.py --demo --days 7
          python mushroom_forecast.py --demo --json > /dev/null
          python mushroom_forecast.py --version
