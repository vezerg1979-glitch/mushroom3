name: build-apk

# Сборка в готовом образе kivy/buildozer: версии Java, Gradle, SDK и NDK
# зафиксированы внутри, образ скачивается целиком и не собирается на месте —
# поэтому шага «Build container», на котором всё падало, здесь нет.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Подготовка
        run: |
          git config --global --add safe.directory '*'
          python3 -m pip install --upgrade --no-cache-dir buildozer cython==0.29.36

      - name: Кэш SDK и NDK
        uses: actions/cache@v4
        with:
          path: |
            /root/.buildozer
            android/.buildozer
          key: buildozer-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: buildozer-

      - name: Сборка APK (debug)
        id: apk
        working-directory: android
        env:
          HOME: /root
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      # Тот же разбор, что и в релизной сборке: без него причина падения
      # тонет в тысячах строк вывода buildozer. Отсутствие лога здесь не
      # ошибка, а признак, что упало раньше сборки.
      - name: Найденные ошибки
        if: always()
        working-directory: android
        run: |
          if [ ! -f build.log ]; then
            echo "Лога сборки нет: до сборки дело не дошло."
            echo "Смотрите шаг, который упал раньше этого."
            exit 0
          fi
          echo "===== ошибки ====="
          grep -n -i -E "error:|Command failed|What went wrong|Traceback|not a supported wheel" \
            build.log | tail -30 || true
          echo "===== хвост ====="
          tail -n 30 build.log || true

      - name: Что получилось
        if: always()
        run: ls -la android/bin || true

      - uses: actions/upload-artifact@v4
        with:
          name: mushroom-apk
          path: android/bin/*.apk
          if-no-files-found: error
