name: build-apk

# Сборка в готовом образе kivy/buildozer: версии Java, Gradle, SDK и NDK
# зафиксированы внутри, образ скачивается целиком и не собирается на месте —
# поэтому шага «Build container», на котором всё падало, здесь нет.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Подготовка
        run: |
          git config --global --add safe.directory '*'
          python3 -m pip install --upgrade --no-cache-dir buildozer cython==0.29.36

      - name: Кэш SDK и NDK
        uses: actions/cache@v4
        with:
          path: |
            /root/.buildozer
            android/.buildozer
          key: buildozer-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: buildozer-

      - name: Сборка APK (debug)
        working-directory: android
        env:
          HOME: /root
        run: buildozer -v android debug

      - name: Что получилось
        run: ls -la android/bin || true

      - uses: actions/upload-artifact@v4
        with:
          name: mushroom-apk
          path: android/bin/*.apk
          if-no-files-found: error
