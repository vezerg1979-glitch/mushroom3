[pytest]
# Тесты живут только в tests/ и нигде больше.
#
# Повод. В репозитории завелись копии нескольких файлов тестов в корне
# проекта — остатки старой раскладки. Голый `pytest -q` (так он и запускается
# в релизной сборке) собирал их наравне с настоящими, а копии отстали на
# несколько правок и падали ещё до первой проверки: сборка вставала, причём
# на файлах, которых в tests/ давно нет.
#
# testpaths чинит это на месте: без явного аргумента pytest смотрит только в
# tests/, и случайная копия в корне ни на что не влияет. Отдельный тест
# (test_module_api.py) при этом честно ругается, что такая копия существует, —
# молчать о ней нельзя, иначе человек будет править файл, который никто не
# исполняет.
testpaths = tests

# .buildozer содержит копию исходников и своих тестов; собирать их нельзя —
# это не проект, а его отпечаток на момент прошлой сборки.
norecursedirs = .buildozer .git bin __pycache__ *.egg-info
